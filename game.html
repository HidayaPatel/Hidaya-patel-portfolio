<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive My Portfolio — Hidaya Patel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #283618;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    nav {
      background: #283618;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 58px;
      border-bottom: 1px solid #606c38;
      flex-shrink: 0;
      z-index: 10;
    }
    .nav-logo {
      color: #fefae0;
      font-size: 1.15rem;
      font-weight: 800;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      color: #dda15e;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #bc6c25; }

    /* Canvas fills everything below navbar */
    .canvas-wrapper {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    #roadCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bubbles — positioned absolute inside canvas-wrapper */
    .stop-bubble {
      position: absolute;
      z-index: 50;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.25));
      transition: opacity 0.2s;
    }
    .bubble-inner {
      background: #fefae0;
      border: 2.5px solid #bc6c25;
      border-radius: 16px;
      padding: 18px 22px;
      width: 240px;
    }
    .bubble-arrow { width: 0; height: 0; position: absolute; }
    .arrow-left  .bubble-arrow {
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-right: 15px solid #bc6c25;
      left: -15px; top: 22px;
    }
    .arrow-right .bubble-arrow {
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-left: 15px solid #bc6c25;
      right: -15px; top: 22px;
    }
    .arrow-up .bubble-arrow {
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 15px solid #bc6c25;
      top: -15px; left: 50%;
      transform: translateX(-50%);
    }
    .arrow-down .bubble-arrow {
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 15px solid #bc6c25;
      bottom: -15px; left: 50%;
      transform: translateX(-50%);
    }

    .bubble-stop {
      color: #bc6c25;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin: 0 0 5px;
    }
    .bubble-title {
      color: #283618;
      font-size: 0.92rem;
      font-weight: 800;
      margin: 0 0 7px;
      line-height: 1.3;
    }
    .bubble-desc {
      color: #606c38;
      font-size: 0.78rem;
      line-height: 1.55;
      margin: 0 0 10px;
    }
    .bubble-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
    }
    .bubble-tag {
      background: #283618;
      color: #fefae0;
      font-size: 0.66rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .bubble-btn {
      display: inline-block;
      background: #bc6c25;
      color: #fefae0;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 7px;
      transition: background 0.2s;
    }
    .bubble-btn:hover { background: #a05518; }
    .bubble-keep {
      background: transparent;
      color: #606c38;
      border: none;
      font-size: 0.76rem;
      cursor: pointer;
      margin-top: 6px;
      text-decoration: underline;
      display: block;
      font-family: inherit;
    }
    .bubble-keep:hover { color: #283618; }

    /* End screen */
    #end-screen { display: none; }
    #end-screen.active { display: flex; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Hidaya Patel</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="resume.html">Resume</a></li>

  </nav>

  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="roadCanvas"></canvas>

    <!-- Bubble 0 -->
    <div id="bubble-0" class="stop-bubble" style="display:none;">
      <div class="bubble-inner">
        <p class="bubble-stop">Stop 1</p>
        <h3 class="bubble-title" id="b0-title"></h3>
        <p class="bubble-desc" id="b0-desc"></p>
        <div class="bubble-tags" id="b0-tags"></div>
        <a class="bubble-btn" id="b0-link" href="#" target="_blank">Explore Project &rarr;</a>
        <button class="bubble-keep" onclick="keepDriving(0)">Keep Driving &darr;</button>

      <div class="bubble-arrow"></div>

    <!-- Bubble 1 -->
    <div id="bubble-1" class="stop-bubble" style="display:none;">
      <div class="bubble-inner">
        <p class="bubble-stop">Stop 2</p>
        <h3 class="bubble-title" id="b1-title"></h3>
        <p class="bubble-desc" id="b1-desc"></p>
        <div class="bubble-tags" id="b1-tags"></div>
        <a class="bubble-btn" id="b1-link" href="#" target="_blank">Explore Project &rarr;</a>
        <button class="bubble-keep" onclick="keepDriving(1)">Keep Driving &darr;</button>
      </div>
      <div class="bubble-arrow"></div>

    <!-- Bubble 2 -->
    <div id="bubble-2" class="stop-bubble" style="display:none;">
      <div class="bubble-inner">
        <p class="bubble-stop">Stop 3</p>
        <h3 class="bubble-title" id="b2-title"></h3>
        <p class="bubble-desc" id="b2-desc"></p>
        <div class="bubble-tags" id="b2-tags"></div>
        <a class="bubble-btn" id="b2-link" href="#" target="_blank">Explore Project &rarr;</a>
        <button class="bubble-keep" onclick="keepDriving(2)">Keep Driving &darr;</button>
      </div>
      <div class="bubble-arrow"></div>
    </div>
  </div>

  <!-- End screen -->
  <div id="end-screen" style="position:fixed;inset:0;background:rgba(40,54,24,0.88);z-index:300;align-items:center;justify-content:center;">
    <div style="background:#fefae0;border-radius:20px;padding:52px 56px;text-align:center;max-width:460px;width:92%;animation:popIn 0.4s cubic-bezier(0.22,1,0.36,1);">
      <h2 style="color:#283618;font-size:2rem;margin-bottom:14px;">&#x1F389; You've seen it all!</h2>
      <p style="color:#606c38;margin-bottom:36px;font-size:1rem;line-height:1.65;">Thanks for taking the drive through my work.<br>I'd love to connect!</p>
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
        <a href="resume.html" style="background:#283618;color:#fefae0;border-radius:9px;padding:13px 28px;font-size:1rem;font-weight:700;text-decoration:none;display:inline-block;">View Resume</a>
        <a href="mailto:hidayaaiyub@gmail.com" style="background:#bc6c25;color:#fefae0;border-radius:9px;padding:13px 28px;font-size:1rem;font-weight:700;text-decoration:none;display:inline-block;">Contact Me</a>
      </div>
    </div>
  </div>

  <script>
    var canvas  = document.getElementById('roadCanvas');
    var ctx     = canvas.getContext('2d');
    var wrapper = document.getElementById('canvasWrapper');

    // Fill full available space
    var CW = wrapper.clientWidth;
    var CH = wrapper.clientHeight;
    canvas.width  = CW;
    canvas.height = CH;

    // ── Road control points ──────────────────────────────────────
    var CP = [
      {x: CW*0.50, y: CH*0.96},
      {x: CW*0.38, y: CH*0.82},
      {x: CW*0.14, y: CH*0.70},
      {x: CW*0.10, y: CH*0.54},
      {x: CW*0.22, y: CH*0.42},
      {x: CW*0.46, y: CH*0.36},
      {x: CW*0.70, y: CH*0.40},
      {x: CW*0.82, y: CH*0.26},
      {x: CW*0.68, y: CH*0.13},
      {x: CW*0.46, y: CH*0.05},
    ];

    // ── Catmull-Rom ──────────────────────────────────────────────
    function catmullRom(p0,p1,p2,p3,t) {
      var t2=t*t, t3=t2*t;
      return {
        x: 0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y: 0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
      };
    }

    function samplePath(cp, total) {
      var pts=[], segs=cp.length-1, per=Math.ceil(total/segs);
      for (var i=0;i<segs;i++) {
        var p0=cp[Math.max(0,i-1)], p1=cp[i], p2=cp[i+1], p3=cp[Math.min(cp.length-1,i+2)];
        for (var j=0;j<per;j++) pts.push(catmullRom(p0,p1,p2,p3,j/per));
      }
      pts.push(cp[cp.length-1]);
      return pts;
    }

    var pathPts = samplePath(CP, 800);

    function getPt(t) {
      var i=Math.min(Math.floor(t*(pathPts.length-1)), pathPts.length-1);
      return pathPts[i];
    }
    function getAngle(t) {
      var i=Math.min(Math.floor(t*(pathPts.length-1)), pathPts.length-5);
      var a=pathPts[Math.max(0,i)], b=pathPts[Math.min(pathPts.length-1,i+5)];
      return Math.atan2(b.y-a.y, b.x-a.x);
    }
    function getNormal(t) {
      var a=getAngle(t);
      return {x:-Math.sin(a), y:Math.cos(a)};
    }

    // ── Projects ─────────────────────────────────────────────────
    var STOPS = [
      {
        t:0.40, id:0,
        title:'Stock Price Prediction ML Pipeline',
        desc:'End-to-end ML pipeline with 28 technical indicators, XGBoost modeling, SHAP interpretability, and a live Streamlit dashboard.',
        tags:['Python','XGBoost','SHAP','Streamlit'],
        link:'project-stock.html'
      },
      {
        t:0.65, id:1,
        title:'Regression Analysis — Starbucks Sugar',
        desc:'Regression analysis identifying which nutritional factors most predict sugar content in Starbucks drinks, with full diagnostics.',
        tags:['R','Linear Regression','ggplot2'],
        link:'project-regression.html'
      },
      {
        t:0.88, id:2,
        title:'K-Means Clustering — COVID-19 Ontario',
        desc:'K-Means and Hierarchical clustering to map COVID-19 severity across Ontario regions for resource allocation insights.',
        tags:['Python','K-Means','Pandas','Seaborn'],
        link:'project-kmeans.html'
      }
    ];

    var stopPositions = STOPS.map(function(s) {
      return Object.assign({}, s, {pos: getPt(s.t), norm: getNormal(s.t)});
    });

    // ── Bubble positioning ────────────────────────────────────────
    function showBubble(idx) {
      var s  = stopPositions[idx];
      var b  = document.getElementById('bubble-'+idx);
      var bW = 260, bH = 220;

      document.getElementById('b'+idx+'-title').textContent = s.title;
      document.getElementById('b'+idx+'-desc').textContent  = s.desc;
      document.getElementById('b'+idx+'-tags').innerHTML    = s.tags.map(function(t){ return '<span class="bubble-tag">'+t+'</span>'; }).join('');
      document.getElementById('b'+idx+'-link').href         = s.link;

      // Sign position
      var sx = s.pos.x + s.norm.x * 48;
      var sy = s.pos.y + s.norm.y * 48;

      var left, top, arrowClass;

      if (sx > CW * 0.65) {
        // Sign on right → bubble to left
        left = sx - bW - 18;
        top  = sy - 28;
        arrowClass = 'arrow-right';
      } else if (sx < CW * 0.35) {
        // Sign on left → bubble to right
        left = sx + 18;
        top  = sy - 28;
        arrowClass = 'arrow-left';
      } else if (sy > CH * 0.55) {
        // Sign on bottom half → bubble above
        left = sx - bW / 2;
        top  = sy - bH - 18;
        arrowClass = 'arrow-down';
      } else {
        // Default → bubble below
        left = sx - bW / 2;
        top  = sy + 18;
        arrowClass = 'arrow-up';
      }

      // Clamp within canvas
      left = Math.max(8, Math.min(left, CW - bW - 8));
      top  = Math.max(8, Math.min(top,  CH - bH - 8));

      b.style.left    = left + 'px';
      b.style.top     = top  + 'px';
      b.className     = 'stop-bubble ' + arrowClass;
      b.style.display = 'block';
    }

    function hideBubble(idx) {
      document.getElementById('bubble-'+idx).style.display = 'none';
    }

    function keepDriving(idx) {
      hideBubble(idx);
      paused = false;
    }

    // ── Game state ────────────────────────────────────────────────
    var carT=0, speed=0, steer=0, paused=false;
    var triggered = new Set();
    var keys = {};

    document.addEventListener('keydown', function(e) {
      keys[e.key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key) !== -1) e.preventDefault();
    });
    document.addEventListener('keyup', function(e) { keys[e.key] = false; });

    // ── Trees ─────────────────────────────────────────────────────
    var ROAD_W = Math.max(54, Math.round(CW * 0.055));
    var treeData = [];
    (function initTrees() {
      var attempts=0;
      while (treeData.length < 22 && attempts < 400) {
        attempts++;
        var tx = 30 + Math.random()*(CW-60);
        var ty = 30 + Math.random()*(CH-60);
        var ok = true;
        for (var pi=0; pi<pathPts.length; pi+=8) {
          var p=pathPts[pi], dx=p.x-tx, dy=p.y-ty;
          if (dx*dx+dy*dy < (ROAD_W+28)*(ROAD_W+28)) { ok=false; break; }
        }
        if (ok) treeData.push({x:tx, y:ty, r:12+Math.random()*10});
      }
    })();

    function drawTrees() {
      treeData.forEach(function(t) {
        // Trunk
        ctx.fillStyle = '#5c3d1e';
        ctx.fillRect(t.x-3, t.y+t.r-2, 6, 14);
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.ellipse(t.x+4, t.y+t.r+8, t.r*0.7, t.r*0.3, 0, 0, Math.PI*2);
        ctx.fill();
        // Canopy dark
        ctx.fillStyle = '#3d5218';
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur  = 6;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
        ctx.fill();
        // Canopy highlight
        ctx.fillStyle = '#606c38';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(t.x-t.r*0.3, t.y-t.r*0.3, t.r*0.6, 0, Math.PI*2);
        ctx.fill();
      });
    }

    function drawStopSigns() {
      stopPositions.forEach(function(s, i) {
        var nx=s.norm.x, ny=s.norm.y;
        var px=s.pos.x+nx*48, py=s.pos.y+ny*48;
        var hit=triggered.has(i);

        // Pole
        ctx.fillStyle = '#8a8a7a';
        ctx.fillRect(px-2, py-32, 4, 32);

        ctx.save();
        ctx.translate(px, py-34);

        // Sign glow
        ctx.shadowColor = hit ? 'rgba(96,108,56,0.5)' : 'rgba(188,108,37,0.8)';
        ctx.shadowBlur  = hit ? 5 : 18;
        ctx.fillStyle   = hit ? '#606c38' : '#bc6c25';
        ctx.beginPath();
        ctx.roundRect(-26,-17, 52, 34, 7);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle    = '#fefae0';
        ctx.font         = 'bold 9px Segoe UI';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('STOP '+(i+1), 0, -5);
        ctx.font = hit ? 'bold 12px Segoe UI' : '10px Segoe UI';
        ctx.fillText(hit ? '\u2713' : '\u25CF', 0, 8);
        ctx.restore();
      });
    }

    function drawCar() {
      var pos=getPt(carT), angle=getAngle(carT), norm=getNormal(carT);
      var wx=norm.x*steer*6, wy=norm.y*steer*6;

      ctx.save();
      ctx.translate(pos.x+wx, pos.y+wy);
      ctx.rotate(angle + steer*0.09);

      // Shadow
      ctx.fillStyle='rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(4,7,16,9,0,0,Math.PI*2);
      ctx.fill();

      // Body
      ctx.fillStyle='#bc6c25';
      ctx.shadowColor='rgba(188,108,37,0.5)';
      ctx.shadowBlur=12;
      ctx.beginPath();
      ctx.roundRect(-13,-22,26,44,6);
      ctx.fill();
      ctx.shadowBlur=0;

      // Cabin
      ctx.fillStyle='#8a4a15';
      ctx.beginPath();
      ctx.roundRect(-9,-14,18,22,4);
      ctx.fill();

      // Front windshield
      ctx.fillStyle='rgba(210,235,255,0.82)';
      ctx.beginPath();
      ctx.roundRect(-7,-20,14,9,3);
      ctx.fill();

      // Rear window
      ctx.fillStyle='rgba(210,235,255,0.5)';
      ctx.beginPath();
      ctx.roundRect(-6,9,12,8,2);
      ctx.fill();

      // Wheels
      ctx.fillStyle='#1a1a1a';
      var wh=[[-15,-16],[10,-16],[-15,8],[10,8]];
      wh.forEach(function(w) {
        ctx.beginPath();
        ctx.roundRect(w[0],w[1],5,10,2);
        ctx.fill();
        ctx.fillStyle='#555';
        ctx.beginPath();
        ctx.arc(w[0]+2.5,w[1]+5,2,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#1a1a1a';
      });

      // Headlights
      ctx.fillStyle='#ffe566';
      ctx.shadowColor='#ffe566';
      ctx.shadowBlur=10;
      [[-7,-23],[7,-23]].forEach(function(l) {
        ctx.beginPath();
        ctx.ellipse(l[0],l[1],4,2.5,0,0,Math.PI*2);
        ctx.fill();
      });

      // Tail lights
      ctx.fillStyle='#ff3b3b';
      ctx.shadowColor='#ff3b3b';
      ctx.shadowBlur=8;
      [[-6,22],[6,22]].forEach(function(l) {
        ctx.beginPath();
        ctx.ellipse(l[0],l[1],3.5,2,0,0,Math.PI*2);
        ctx.fill();
      });

      ctx.shadowBlur=0;
      ctx.restore();
    }

    function drawHUD() {
      // Controls hint at top
      ctx.fillStyle='rgba(40,54,24,0.45)';
      ctx.font='bold 13px Segoe UI';
      ctx.textAlign='center';
      ctx.textBaseline='top';
      ctx.fillText('Drive to Discover My Projects', CW/2, 16);
      ctx.fillStyle='rgba(40,54,24,0.35)';
      ctx.font='11px Segoe UI';
      ctx.fillText('\u2191 W  Accelerate    \u2193 S  Brake    \u2190 \u2192  Steer', CW/2, 34);

      // Press UP hint
      if (speed<0.0002 && carT<0.96 && !paused) {
        ctx.fillStyle='rgba(40,54,24,0.5)';
        ctx.font='bold 15px Segoe UI';
        ctx.textAlign='center';
        ctx.textBaseline='alphabetic';
        ctx.fillText('Press \u2191 to start driving', CW/2, CH-16);
      }

      // Progress
      ctx.fillStyle='rgba(40,54,24,0.4)';
      ctx.font='11px Segoe UI';
      ctx.textAlign='right';
      ctx.textBaseline='alphabetic';
      ctx.fillText('Stops visited: '+triggered.size+' / 3', CW-16, CH-14);
    }

    // ── Draw ──────────────────────────────────────────────────────
    function draw() {
      // Cream/peach background
      ctx.fillStyle='#f5e6cc';
      ctx.fillRect(0,0,CW,CH);

      // Subtle texture grid
      ctx.fillStyle='rgba(188,108,37,0.04)';
      for (var gx=0;gx<CW;gx+=60) {
        for (var gy=0;gy<CH;gy+=60) {
          ctx.fillRect(gx,gy,30,30);
        }
      }

      drawTrees();

      // Road shadow
      ctx.save();
      ctx.strokeStyle='rgba(0,0,0,0.18)';
      ctx.lineWidth=ROAD_W+10;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      pathPts.forEach(function(p,i){ if(i===0) ctx.moveTo(p.x+4,p.y+5); else ctx.lineTo(p.x+4,p.y+5); });
      ctx.stroke();
      ctx.restore();

      // Road surface
      ctx.save();
      ctx.strokeStyle='#6b5a40';
      ctx.lineWidth=ROAD_W;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      pathPts.forEach(function(p,i){ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
      ctx.stroke();
      ctx.restore();

      // Road edges (cream)
      [-1,1].forEach(function(side) {
        ctx.save();
        ctx.strokeStyle='rgba(254,250,224,0.7)';
        ctx.lineWidth=2.5;
        ctx.lineCap='round';
        ctx.beginPath();
        pathPts.forEach(function(p,i) {
          var t=i/(pathPts.length-1), ang=getAngle(t);
          var nx=-Math.sin(ang)*(ROAD_W/2-4)*side;
          var ny= Math.cos(ang)*(ROAD_W/2-4)*side;
          if(i===0) ctx.moveTo(p.x+nx,p.y+ny); else ctx.lineTo(p.x+nx,p.y+ny);
        });
        ctx.stroke();
        ctx.restore();
      });

      // Center dashes (tan)
      ctx.save();
      ctx.strokeStyle='rgba(221,161,94,0.9)';
      ctx.lineWidth=2.5;
      ctx.setLineDash([20,16]);
      ctx.lineCap='round';
      ctx.beginPath();
      pathPts.forEach(function(p,i){ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      drawStopSigns();
      drawCar();
      drawHUD();
    }

    // ── Game loop ─────────────────────────────────────────────────
    function tick() {
      if (!paused) {
        var accel=(keys['ArrowUp']||keys['w']||keys['W']) ? 0.0009 : 0;
        var brake=(keys['ArrowDown']||keys['s']||keys['S']) ? 0.0014 : 0;
        speed += accel;
        speed -= brake;
        speed  = Math.max(0, Math.min(speed, 0.0042));
        speed *= 0.97;

        if (keys['ArrowLeft']||keys['a']||keys['A']) steer=Math.max(-1,steer-0.1);
        else if (keys['ArrowRight']||keys['d']||keys['D']) steer=Math.min(1,steer+0.1);
        else steer*=0.78;

        carT = Math.min(1, carT+speed);

        STOPS.forEach(function(s,i) {
          if (!triggered.has(i) && Math.abs(carT-s.t)<0.018) {
            triggered.add(i);
            speed=0;
            paused=true;
            (function(idx){ setTimeout(function(){ showBubble(idx); }, 250); })(i);
          }
        });

        if (carT>=0.97 && triggered.size===3) {
          paused=true;
          setTimeout(function(){ document.getElementById('end-screen').classList.add('active'); }, 700);
        }
      }
      draw();
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
