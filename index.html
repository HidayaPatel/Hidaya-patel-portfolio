<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidaya Patel — Data Scientist</title>
  <meta name="description" content="Data science projects by Hidaya Patel, answered by one crowd of 360 tiles that rebuilds itself into every graph.">
  <meta property="og:title" content="Hidaya Patel — Data Scientist">
  <meta property="og:description" content="Four data projects, told by one crowd of tiles.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'%3E%3Cpath d='M0 0h1v3H0zM2 0h1v2H2zM1 1h1v1H1z' fill='%23151515'/%3E%3Cpath d='M2 2h1v1H2z' fill='%23d91e18'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ink.css">
  <style>
    main { max-width: 1040px; margin: 0 auto; padding: 92px 24px 40px; text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: clamp(2rem, 5vw, 3.6rem); font-weight: 800; font-stretch: 112%; line-height: 1.04; letter-spacing: -.025em; text-wrap: balance; outline: none; min-height: 1.04em; }
    main:not(.asking) h1 { font-size: clamp(1.7rem, 3.5vw, 2.6rem); }
    main:not(.asking) #crowd { height: clamp(260px, 47vh, 480px); margin-top: 14px; }
    .lead { font-size: 1.08rem; line-height: 1.6; margin-top: 12px; max-width: 56ch; }
    #crowd { width: 100%; height: clamp(260px, 50vh, 500px); display: block; margin: 18px 0 6px; touch-action: pan-y; }
    #key { min-height: 1.5em; color: var(--muted); font-size: .95rem; }
    #reply { max-width: 60ch; }
    #reply p { font-size: 1.16rem; line-height: 1.55; margin: 8px 0 14px; text-wrap: pretty; }
    .ask { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; max-width: 900px; }
    .ask button { font: inherit; font-weight: 600; font-size: 1rem; color: var(--ink); background: none; border: 2px solid var(--ink); padding: 13px 18px; min-height: 48px; cursor: pointer; transition: background .15s, color .15s; }
    .ask button:hover { background: var(--ink); color: #fff; }
    .ask button[hidden] { display: none; }
    #contact { border-top: 2px solid var(--ink); max-width: 1040px; margin: 24px auto 0; padding: 40px 24px 64px; text-align: center; scroll-margin-top: 72px; }
    #contact h2 { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 800; font-stretch: 112%; letter-spacing: -.02em; margin-bottom: 8px; }
    #contact .links { justify-content: center; }
    noscript p { margin-top: 20px; }
    @media (max-width: 860px) {
      main { padding: 76px 16px 32px; }
      h1 { font-size: 1.9rem; }
      .lead { font-size: 1rem; }
      main:not(.asking) #crowd { height: min(102vw, 440px); margin: 12px 0 4px; }
      .asking #crowd { height: min(46vw, 260px); margin: 16px 0 4px; }
      #reply p { font-size: 1.05rem; }
      .ask { flex-direction: column; width: 100%; gap: 8px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#ask">Skip to questions</a>
  <nav>
    <a href="index.html" class="me">Hidaya Patel</a>
    <div><a href="projects.html">30-second version</a><a href="#contact">Contact</a></div>
  </nav>

  <main id="main" class="asking">
    <h1 id="title" tabindex="-1">Ask my data something.</h1>
    <p class="lead" id="lead">I'm Hidaya Patel, a data scientist. Pick a question, and 360 tiles will line up to answer it.</p>
    <canvas id="crowd" role="img" aria-label="360 tiles spelling Hidaya"></canvas>
    <p id="key"></p>
    <div id="reply" hidden><p id="answer"></p><a class="btn solid" id="study" href="projects.html">Read the full study</a></div>
    <div class="ask" id="ask" role="group" aria-label="Questions you can ask"></div>
    <noscript><p><a href="projects.html">See all four projects</a></p></noscript>
  </main>

  <section id="contact">
    <h2>Have data that needs a story?</h2>
    <p>Tell me what you're trying to find out.</p>
    <div class="links">
      <a class="btn solid" href="mailto:hidaya.ayub.jobs@gmail.com">Email me</a>
      <a class="btn" href="https://www.linkedin.com/in/hidayapatel" target="_blank" rel="noopener">LinkedIn</a>
      <a class="btn" href="https://github.com/HidayaPatel" target="_blank" rel="noopener">GitHub</a>
    </div>
  </section>

  <script src="mosaic.js"></script>
  <script>
    const QUESTIONS = {
      ttc: {
        q: 'When is the subway most likely to be late?', scene: 'heatmap', page: 'project-ttc.html',
        a: 'When service opens and again from 4 to 6pm. The fullest tile is Sunday at 8am, opening time. From 97,227 incidents I built a model that ranks the risk for every station and hour.',
        key: 'Fuller tile, more delays per hour. Red is 1.8 or more.',
        alt: 'Heatmap of average delays by day and hour. Highest: Sunday 8am at 2.62, Tuesday and Thursday 4pm at 2.01.',
      },
      stock: {
        q: 'Can technical signals beat the market?', scene: 'dumbbell', page: 'project-stock.html',
        a: 'No. Each model looked better in training than on new days, and none beat always guessing "up". The more complex the model, the harder it fell.',
        key: 'Outline is training accuracy, red is new data. Each small tile is about one point lost.',
        alt: 'Dumbbell chart. Logistic regression 53.8% in training, 50.5% on new data. Random forest 66.7% to 47.9%. XGBoost 72.0% to 47.7%. Always guessing up scores 54.3%.',
      },
      covid: {
        q: 'Which cities needed help first?', scene: 'matrix', page: 'project-kmeans.html',
        a: 'Toronto, then Mississauga and Newmarket. I grouped 34 Ontario cities five different ways. In K-means, those two only split from the rest once Toronto was removed.',
        key: 'Solid red is the highest-count group. Emptier tiles are lower groups.',
        small: ' A: K-means. B: K-means, no Toronto. C: four groups, no Toronto. D: hierarchical. E: hierarchical, no Toronto.',
        alt: 'Matrix of city groups across five clustering runs. Toronto is always in its own group. Mississauga joins the top group in all three runs without Toronto, Newmarket in two.',
      },
      sugar: {
        q: 'What drives the sugar in a Starbucks drink?', scene: 'lines', page: 'project-regression.html',
        a: 'Mostly calories. At the same calories, a fattier drink has less room for sugar. With fibre, these explain 95.5% of the difference between 238 drinks.',
        key: 'Model estimates for drinks with no fibre.',
        alt: 'Three model lines of sugar against calories for 0, 5 and 10 grams of fat. Each 5 grams of fat lowers estimated sugar by about 13 grams.',
      },
    };
    const $ = (id) => document.getElementById(id);
    let current = null;
    const crowd = Mosaic.mount($('crowd'), 'name', (hint) => { $('key').textContent = hint || keyFor(); });
    function keyFor() { const x = QUESTIONS[current]; return x ? x.key + (x.small && $('crowd').clientWidth < 620 ? x.small : '') : ''; }
    const buttons = Object.entries(QUESTIONS).map(([id, x]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = x.q;
      b.addEventListener('click', () => { history.pushState(null, '', '#' + id); show(id, true); });
      b.dataset.id = id;
      $('ask').append(b);
      return b;
    });
    function show(id, move) {
      const x = QUESTIONS[id];
      current = x ? id : null;
      $('title').textContent = x ? x.q : 'Ask my data something.';
      $('lead').hidden = !!x;
      $('main').classList.toggle('asking', !x);
      $('reply').hidden = !x;
      $('key').textContent = keyFor();
      buttons.forEach((b) => { b.hidden = b.dataset.id === id; });
      $('crowd').setAttribute('aria-label', x ? x.alt : '360 tiles spelling Hidaya');
      if (x) { $('answer').textContent = x.a; $('study').href = x.page; }
      crowd.go(x ? x.scene : 'name');
      if (move) { $('title').focus({ preventScroll: true }); scrollTo({ top: 0 }); }
    }
    function fromHash() { const id = location.hash.slice(1); if (id !== 'contact' && id !== 'ask') show(QUESTIONS[id] ? id : null, false); }
    addEventListener('popstate', fromHash);
    addEventListener('hashchange', fromHash);
    fromHash();
  </script>
</body>
</html>
